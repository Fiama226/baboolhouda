# =============================================================================
# TV Baaboul Houda — local development / preview (Docker-first workflow)
#
#   docker compose up -d        →  http://localhost:8080  (site)
#                                  http://localhost:8080/wp-admin (admin)
#   docker compose logs -f
#
# First run performs the WordPress installer once (pick admin user/password),
# then the core plugin creates the section pages automatically on activation.
# =============================================================================

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-baboul_wp}
      MARIADB_USER: ${DB_USER:-baboul}
      MARIADB_PASSWORD: ${DB_PASSWORD:-baboulpass}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    # DB is internal only.
    expose:
      - "3306"

  site:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-baboul_wp}
      WORDPRESS_DB_USER: ${DB_USER:-baboul}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-baboulpass}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "0"
    volumes:
      - wp-html:/var/www/html
      # Live dev: theme + core plugin are mounted from the repo, so edits show
      # up immediately and a rebuild never leaves stale copies in the volume.
      - ./site/wp-content/themes/baaboul-houda:/var/www/html/wp-content/themes/baaboul-houda
      - ./site/wp-content/plugins/baaboul-houda-core:/var/www/html/wp-content/plugins/baaboul-houda-core

  # One-shot: installs WordPress and activates the theme + core plugin, so the
  # site is ready at first `docker compose up` (no installer to click through).
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"   # same uid as www-data in the site image
    depends_on:
      - site
    restart: "no"
    volumes:
      - wp-html:/var/www/html
      - ./site/wp-content/themes/baaboul-houda:/var/www/html/wp-content/themes/baaboul-houda
      - ./site/wp-content/plugins/baaboul-houda-core:/var/www/html/wp-content/plugins/baaboul-houda-core
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-baboul_wp}
      WORDPRESS_DB_USER: ${DB_USER:-baboul}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-baboulpass}
      HTTP_PORT: ${HTTP_PORT:-8080}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        until [ -f wp-config.php ] && wp db check >/dev/null 2>&1; do sleep 2; done
        wp core is-installed 2>/dev/null || wp core install \
          --url="http://localhost:$${HTTP_PORT}" \
          --title="TV Baaboul Houda" \
          --admin_user="${WP_ADMIN_USER:-admin}" \
          --admin_password="${WP_ADMIN_PASSWORD:-admin}" \
          --admin_email="${WP_ADMIN_EMAIL:-admin@example.com}" \
          --skip-email
        # Plugin first: the theme calls helpers (bh_l) defined by the plugin, and
        # it is already the (only) active theme after install, so skip it here.
        wp plugin activate baaboul-houda-core --skip-themes
        wp theme activate baaboul-houda
        wp rewrite structure '/%postname%/'
        echo ">> Ready: theme + core plugin active"

volumes:
  db-data:
  wp-html:
