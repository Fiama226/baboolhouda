name: CI

on:
  push:
  pull_request:

jobs:
  php-lint:
    name: php -l (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint every PHP file under site/wp-content
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli sh -c '
            set -e
            find site/wp-content -name "*.php" -print0 | xargs -0 -n1 php -l > /tmp/lint.log || { grep -v "^No syntax errors" /tmp/lint.log; exit 1; }
            echo "PHP lint OK: $(grep -c "^No syntax errors" /tmp/lint.log) files"
          '

  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  dist-fresh:
    name: assets/dist is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if the committed build differs from a fresh build
        run: git diff --exit-code -- site/wp-content/themes/baaboul-houda/assets/dist

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tv-baaboul-houda .
